name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish when run manually (for example v0.1.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate trigger inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when running release workflow manually"
            exit 1
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install 1.81.0 --profile minimal
      - name: Package Rust crates
        run: cargo +1.81.0 package -p agentsnap-core --locked
      - name: Build Python package
        working-directory: sdks/python
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Verify Node package
        working-directory: sdks/node
        run: npm pack --dry-run

  binaries:
    name: Linux binaries
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.81.0 --profile minimal
      - name: Build release binaries
        run: |
          cargo +1.81.0 build --release -p agentsnap-cli -p agentsnap-daemon
          tar -czf agentsnap-linux-x86_64.tar.gz -C target/release agentsnap-cli agentsnap-daemon
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ inputs.release_tag }}"
          fi
          if [ -z "$tag" ]; then
            echo "unable to determine release tag"
            exit 1
          fi
          gh release create "$tag" --generate-notes || true
          gh release upload "$tag" agentsnap-linux-x86_64.tar.gz --clobber

  publish-python:
    name: Publish Python package
    needs: verify
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and publish
        working-directory: sdks/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
          python3 -m pip install --upgrade twine
          twine upload dist/*

  publish-node:
    name: Publish Node package
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish
        working-directory: sdks/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken="$NODE_AUTH_TOKEN"
          npm publish --access public

  publish-rust:
    name: Publish Rust crates
    needs: verify
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.81.0 --profile minimal
      - name: Publish Rust workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +1.81.0 publish --workspace --locked
