name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain and runtime dependencies
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install --yes bubblewrap shellcheck
      - name: Format
        run: cargo +1.81.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.81.0 clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.81.0 test --workspace --all-targets
      - name: Daemon and CLI smoke test
        run: |
          cargo +1.81.0 build -p agentsnap-cli -p agentsnap-daemon
          socket="/tmp/agentsnap-ci-${GITHUB_RUN_ID}.sock"
          AGENTSNAP_SOCKET="$socket" target/debug/agentsnap-daemon > /tmp/agentsnap-daemon.log 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; rm -f "$socket"' EXIT
          for _ in $(seq 1 100); do
            [ -S "$socket" ] && break
            sleep 0.02
          done
          [ -S "$socket" ]
          AGENTSNAP_SOCKET="$socket" target/debug/agentsnap-cli exec --workspace . --command "printf integration-ok"
      - name: Shell checks
        run: shellcheck scripts/*.sh infra/terraform/*/*.sh

  rust-macos:
    name: Rust macOS compatibility
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.81.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.81.0 clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.81.0 test --workspace --all-targets

  hardened-linux:
    name: Linux hardened security tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain and runtime dependencies
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3
      - name: Run privileged hardened tests
        run: sudo -E cargo +1.81.0 test -p agentsnap-core --test linux_security -- --nocapture

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest build
      - name: Test SDK
        working-directory: sdks/python
        run: python -m pytest -q
      - name: Build package
        working-directory: sdks/python
        run: python -m build

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test SDK
        working-directory: sdks/node
        run: npm test
      - name: Verify package contents
        working-directory: sdks/node
        run: npm pack --dry-run

  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate AWS
        working-directory: infra/terraform/aws
        run: terraform init -backend=false && terraform validate
      - name: Validate GCP
        working-directory: infra/terraform/gcp
        run: terraform init -backend=false && terraform validate

  benchmark:
    name: Benchmark report
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install 1.81.0 --profile minimal
      - name: Run benchmark
        run: cargo +1.81.0 bench -p agentsnap-core --bench snapshot_latency
