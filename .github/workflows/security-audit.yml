name: Security Audits

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  npm:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Audit Node dependencies
        working-directory: sdks/node
        run: npm audit --audit-level=high

  python:
    name: Python audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit Python environment and package
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          pip-audit --local --strict

  terraform:
    name: Terraform dependency validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate AWS providers and configuration
        working-directory: infra/terraform/aws
        run: terraform init -backend=false && terraform validate
      - name: Validate GCP providers and configuration
        working-directory: infra/terraform/gcp
        run: terraform init -backend=false && terraform validate
