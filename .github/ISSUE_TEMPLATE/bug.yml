name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: "0.1.0, Ubuntu 24.04 x86_64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and doctor output
      description: Remove secrets and private source before posting.
