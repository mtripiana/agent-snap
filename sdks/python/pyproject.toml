[project]
name = "agentsnap"
version = "0.1.0"
description = "Python SDK for AgentSnap daemon"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "AgentSnap contributors" }]
keywords = ["sandbox", "security", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/agentsnap/agentsnap"
Repository = "https://github.com/agentsnap/agentsnap"
Issues = "https://github.com/agentsnap/agentsnap/issues"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
